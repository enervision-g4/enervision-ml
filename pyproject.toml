[project]
name = "enervision-ml"
version = "0.1.0"
description = "Service de prevision de consommation EnerVision : entrainement par site et ecriture des previsions"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    # Lecture de l'historique et ecriture des previsions. La variante binaire
    # embarque libpq : l'etage final de l'image reste sans chaine de compilation.
    "psycopg[binary]>=3.2",
    # HistGradientBoostingRegressor : NaN natifs, pas de mise a l'echelle a
    # maintenir, entrainement en secondes sur l'historique d'un site.
    "scikit-learn>=1.7",
    # Matrice de features ; transitive de scikit-learn mais importee directement,
    # donc declaree.
    "numpy>=2.1",
    "structlog>=24.4",
    "typer>=0.15",
    # Windows ne fournit aucune base de fuseaux horaires : zoneinfo la lit dans ce paquet.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.scripts]
enervision-ml = "enervision_ml.cli:application"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pdoc>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enervision_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import-mode=importlib affranchit l'arborescence de tests de la contrainte de noms
# de fichiers uniques, que le miroir des paquets rend probable.
# -m "not integration" par defaut : la suite doit passer sans infrastructure. Les
# tests marques integration se lancent explicitement, voir tests/integration.
addopts = "-v --strict-markers --import-mode=importlib -m 'not integration'"
markers = [
    "integration: necessite un PostgreSQL reel, exclu de la suite par defaut",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RUF", "D"]
# Les regles de codage du projet imposent Optional[X] plutot que la forme X | None.
# D107 : le contrat du constructeur est decrit dans la docstring de la classe.
ignore = ["UP007", "UP045", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Les tests se documentent par leur nom, pas par une docstring.
"tests/*" = ["ANN", "D"]
"scripts/*" = ["D103"]

[tool.mypy]
strict = true
# Les scripts consomment l'API publique du paquet : les inclure fait echouer la
# verification des qu'une signature change sans que les appelants suivent.
files = ["src", "scripts"]

[[tool.mypy.overrides]]
# scikit-learn ne livre pas de py.typed.
module = ["sklearn.*"]
ignore_missing_imports = true
