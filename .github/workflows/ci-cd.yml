name: Build, push and deploy ML

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      stage: ${{ steps.meta.outputs.stage }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag and stage
        id: meta
        run: |
          echo "image=ghcr.io/enervision-g4/enervision-ml:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "stage=prod" >> "$GITHUB_OUTPUT"
          else
            echo "stage=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            BUILD_REF=${{ github.sha }}

  deploy:
    needs: build-and-push
    uses: enervision-g4/enervision-devops/.github/workflows/deploy.yml@main
    with:
      service: ml
      stage: ${{ needs.build-and-push.outputs.stage }}
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit
